<!DOCTYPE html>
<html>
<head>
    <title>Messi vs Ronaldo Vote</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <h1>GOAT Voting</h1>
        <p>Who is the greatest football player?</p>

        <div class="players">

            <div class="player-card">
                <img src="cd6e0e0a5a5ef27603fb329d70d2f68b.jpg" alt="Messi">
                <h2>Messi</h2>
                <h3>Votes: <span id="messiVotes">0</span></h3>
                <button id="messiBtn">Vote Messi</button>
            </div>


            <div class="player-card">
                <img src="186067c3c81040a68a049b9344b9f995.jpg" alt="Ronaldo">
                <h2>Ronaldo</h2>
                <h3>Votes: <span id="ronaldoVotes">0</span></h3>
                <button id="ronaldoBtn">Vote Ronaldo</button>
            </div>

        </div>

    </div>

<script type="module" src="script.js"></script>
</body>
</html>
