<!DOCTYPE html>
<html>
<head>
    <title>Messi vs Ronaldo Vote</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <h1>GOAT Voting</h1>
        <p>Who is the greatest football player?</p>

        <div class="players">

            <div class="player-card">
                <img src="https://via.placeholder.com/200" alt="Messi">
                <h2>Messi</h2>
                <h3>Votes: <span id="messiVotes">0</span></h3>
                <button id="messiBtn">Vote Messi</button>
            </div>


            <div class="player-card">
                <img src="https://via.placeholder.com/200" alt="Ronaldo">
                <h2>Ronaldo</h2>
                <h3>Votes: <span id="ronaldoVotes">0</span></h3>
                <button id="ronaldoBtn">Vote Ronaldo</button>
            </div>

        </div>

    </div>

</body>
</html>
